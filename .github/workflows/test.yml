on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go: [1.25.x, 1.26.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test ./...